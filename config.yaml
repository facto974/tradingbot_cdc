mode: paper
exchange: crypto_com
loop_interval: 300
universe:
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - BONK-USD
  - WLD-USD
  - ONDO-USD
  - ENA-USD
  - SHIB-USD
  - ARB-USD
  - TIA-USD

strategy:
  weights:
    momentum: 0.55
    sentiment: 0.20
    fear_greed: 0.25

  momentum:
    lookback_days: 44
    ema_smooth: 7
    enable_trend_filter: false
    sma_fast: 24
    sma_slow: 96

  thresholds:
    long: 0.08
    short: -0.35
    close_threshold: -0.05
    close_short_threshold: -0.15

  sentiment:
    high_conviction: false
    min_active_sources: 1
    require_aligned: false
    min_momentum_abs: 0.05
    reddit_subs:
      - CryptoCurrency
      - CryptoMarkets
      - altcoin
    reddit_limit: 50

risk:
  allow_short: true
  initial_capital: 100
  max_position_usd: 30
  kelly_fraction: 0.25
  stop_loss_pct: 0.060
  take_profit_pct: 0.100
  short_stop_loss_pct: 0.050
  short_take_profit_pct: 0.085
  max_concurrent_positions: 3
  equity_stop_loss_pct: 0.10
  cooldown_after_sl_min: 60
  max_hold_hours: 48
  # Night trading : multiplie la taille de position pendant 20h-4h UTC.
  # 1.30 = positions ~30% plus grosses la nuit (historiquement plus efficace).
  # Mettre à 1.0 pour désactiver.
  night_trading_mult: 1.30

llm:
  validate_signals: false
  model: deepseek/deepseek-v4-flash
  temperature: 0.2

telegram: {}

metrics:
  enabled: true
  port: 8000